<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Form URL</title>
</head>

<body>

    <h1>Form URL</h1>

    <form action="index.html">

        <fieldset>

            <legend>URL</legend>

            <p>
                <label>URL:</label>
                <input
                    type="url"
                    name="url"
                    placeholder="Masukkan URL">
            </p>

            <p>
                <label>Tanggal:</label>
                <input
                    type="date"
                    name="tanggal">
            </p>

            <p>
                <label>Waktu:</label>
                <input
                    type="time"
                    name="waktu">
            </p>

            <p>
                <label>Jumlah:</label>
                <input
                    type="number"
                    name="jumlah">
            </p>

            <input type="submit" value="Send">
            <input type="reset" value="Reset">

        </fieldset>

    </form>

</body>
</html>
