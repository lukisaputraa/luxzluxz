<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Form Pendaftaran</title>
</head>

<body>

    <h1>Form Pendaftaran</h1>

    <form action="index.html">

        <fieldset>

            <legend>Pendaftaran Siswa</legend>

            <p>
                <label>Nama Lengkap:</label>
                <input
                    type="text"
                    name="nama"
                    placeholder="Masukkan nama lengkap">
            </p>

            <p>
                <label>NIS:</label>
                <input
                    type="text"
                    name="nis"
                    placeholder="Masukkan NIS">
            </p>

            <p>
                <label>Jenis Kelamin:</label>

                <input
                    type="radio"
                    name="jenis_kelamin"
                    value="Laki-laki">

                Laki-laki

                <input
                    type="radio"
                    name="jenis_kelamin"
                    value="Perempuan">

                Perempuan
            </p>

            <p>
                <label>Tanggal Lahir:</label>
                <input
                    type="date"
                    name="tanggal_lahir">
            </p>

            <p>
                <label>Jurusan:</label>

                <select name="jurusan">

                    <option value="">
                        -- Pilih Jurusan --
                    </option>

                    <option value="PPLG">
                        PPLG
                    </option>

                    <option value="TJKT">
                        TJKT
                    </option>

                    <option value="MPLB">
                        MPLB
                    </option>

                    <option value="AKL">
                        AKL
                    </option>

                </select>
            </p>

            <p>
                <label>Alamat:</label>
                <br>

                <textarea
                    name="alamat"
                    rows="5"
                    cols="30"
                    placeholder="Masukkan alamat lengkap"></textarea>
            </p>

            <p>
                <label>Foto:</label>
                <input
                    type="file"
                    name="foto">
            </p>

            <p>
                <input
                    type="checkbox"
                    name="persetujuan">

                Saya menyetujui data yang saya masukkan
            </p>

            <input type="submit" value="Daftar">
            <input type="reset" value="Reset">

        </fieldset>

    </form>

</body>
  </html>
